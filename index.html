<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papo English — converse em inglês com IA</title>
<meta name="description" content="Pratique conversação em inglês por voz com IA: correção em português, pronúncia palavra por palavra, vocabulário e simulados. Grátis.">
<meta name="theme-color" content="#2B59E6">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--card:#FFFFFF;--ink:#17202F;--muted:#667085;--line:#E7E3DA;
  --brand:#2B59E6;--brand-2:#1E3A8A;--brand-soft:#E8EEFE;
  --accent:#FF7A1A;--accent-soft:#FFF0E4;
  --ok:#15803D;--ok-soft:#E3F5E9;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#C62828;--bad-soft:#FDE8E8;
  --r:18px;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
#screen{padding:18px 16px 96px}
#screen.full{padding:0}
h1{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:22px 0 10px}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.row-flex{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;border-radius:14px;padding:13px 18px;min-height:46px;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.sec{background:var(--brand-soft);color:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.orange{background:var(--accent)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2)}
.tag.orange{background:var(--accent-soft);color:#B4500B}
.banner{border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:12px}
.banner.info{background:var(--brand-soft);color:var(--brand-2)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
/* tabs */
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
#tabs button .ic{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
#tabs button.on{color:var(--brand)}
#tabs button.on .ic{filter:none;opacity:1}
/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.goal{display:flex;gap:16px;align-items:center}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#F1EDE5 0);display:grid;place-items:center;flex:none}
.ring>div{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:16px;line-height:1.05}
.ring small{font-size:10px;color:var(--muted);font-weight:600}
.lesson{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden}
.lesson .big{font-size:40px;position:absolute;right:16px;top:12px;opacity:.95}
.lesson p{opacity:.85;font-size:13.5px;margin:4px 0 14px;max-width:80%}
.lesson .btn{background:#fff;color:var(--brand-2)}
.tile{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .em{font-size:24px}
.tile b{font-size:14px}
.tile span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.item .em{font-size:24px;width:36px;text-align:center;flex:none}
.item .body{flex:1;min-width:0}
.item .body b{display:block;font-size:14.5px}
.item .body span{font-size:12.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
/* onboarding */
.onb{min-height:calc(100dvh - 40px);display:flex;flex-direction:column}
.onb .prog{height:6px;background:#E9E4DA;border-radius:9px;overflow:hidden;margin:4px 0 22px}
.onb .prog i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.onb .content{flex:1}
.onb .foot{padding-top:16px;display:flex;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-weight:600}
.opt .em{font-size:22px}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{width:auto;margin:0;padding:10px 14px}
.field{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}
.field:focus{border-color:var(--brand)}
textarea.field{min-height:110px;resize:vertical}
.hero{text-align:center;padding-top:30px}
.hero .logo{width:92px;height:92px;margin:0 auto 18px}
.proj{display:flex;align-items:flex-end;gap:10px;height:140px;margin:18px 0 8px}
.proj div{flex:1;background:var(--brand-soft);border-radius:10px 10px 4px 4px;position:relative;transition:height .3s}
.proj div.on{background:var(--accent)}
.proj div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;font-weight:700}
.proj-l{display:flex;gap:10px}
.proj-l span{flex:1;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
/* chat */
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#EFEBE3}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.chathead .t{flex:1;min-width:0}
.chathead .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chathead .t small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.iconbtn:active{background:#0000000d}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow.user{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.bub{max-width:82%;border-radius:18px;padding:10px 13px;font-size:15.5px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word}
.bub.ai{background:#fff;border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bub.user{background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.bub.err{background:var(--bad-soft);color:var(--bad)}
.bub .pt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:13.5px}
.tools{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tools button{font-size:12px;font-weight:600;color:var(--brand-2);background:var(--brand-soft);border-radius:999px;padding:5px 10px}
.ucol{display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:84%}
.ucol .bub{max-width:100%}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#fff;color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.fix{background:var(--warn-soft);color:var(--warn)}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#B7B2A8;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-4px);opacity:1}}
.assist{padding:0 12px}
.assist .card{margin-bottom:8px;padding:12px 14px;font-size:14px}
.sugg{display:block;width:100%;text-align:left;background:var(--brand-soft);border-radius:12px;padding:9px 12px;margin-top:6px}
.sugg small{display:block;color:var(--muted);font-size:12px}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;max-height:120px;min-height:44px;outline:none;font-size:15px;background:#FAF9F6}
.composer textarea:focus{border-color:var(--brand)}
.composer .iconbtn{width:44px;height:44px;border-radius:50%}
.mic{background:var(--accent);color:#fff}
.mic.live{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.45)}70%{box-shadow:0 0 0 12px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.send{background:var(--brand);color:#fff}
.ptbtn{font-size:12px!important;font-weight:800;border:1.5px solid var(--line)}
.ptbtn.on{background:#009C3B;color:#fff;border-color:#009C3B}
/* sheet */
#modal .back{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
#modal .sheet{background:var(--bg);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s}
#modal .grab{width:40px;height:5px;border-radius:9px;background:#D5D0C6;margin:0 auto 14px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
.cmp{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.cmp .card{padding:12px 14px}
.cmp .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.lbl.bad{color:var(--bad)}.lbl.ok{color:var(--ok)}.lbl.br{color:var(--brand)}
mark{background:#FDE68A;border-radius:4px;padding:0 2px;color:inherit}
s.del{color:var(--bad)}
/* pron */
.target{font-size:22px;font-weight:700;line-height:1.35;text-align:center;padding:22px 8px}
.ipa{font-family:ui-monospace,Menlo,monospace;color:var(--brand-2)}
.wscore{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.wscore span{border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.wscore span small{font-size:10.5px;font-weight:700;opacity:.8}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-mid{background:var(--warn-soft);color:var(--warn)}.s-bad{background:var(--bad-soft);color:var(--bad)}
.bigmic{width:84px;height:84px;border-radius:50%;font-size:34px;margin:6px auto;display:grid;place-items:center}
.score-big{font-size:46px;font-weight:800;text-align:center;letter-spacing:-.03em}
.seg{display:flex;background:#E9E4DA;border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--brand-soft);min-height:4px;position:relative}
.bars .b i.hit{background:var(--accent)}
.bars .b em{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.bars .b small{font-size:10.5px;font-weight:700}
.xpbar{height:10px;background:#EEE9DF;border-radius:9px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#FFB066);border-radius:9px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;text-align:center;font-size:11.5px;font-weight:700}
.badge .em{font-size:26px;display:block;margin-bottom:4px}
.badge.off{opacity:.38;filter:grayscale(1)}
.meter{display:flex;align-items:center;gap:10px;margin:6px 0}
.meter span{width:96px;font-size:13px;font-weight:600}
.meter .t{flex:1;height:9px;background:#EEE9DF;border-radius:9px;overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--brand);border-radius:9px}
.meter b{width:34px;text-align:right;font-size:13px}
/* vocab */
.vrow{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;display:flex;gap:10px;align-items:center}
.vrow .body{flex:1;min-width:0}
.vrow .body b{font-size:15px}
.vrow .body div{font-size:13px;color:var(--muted)}
.vrow .body i{font-size:12.5px;color:#8A8F99}
.vrow.done b{text-decoration:line-through;opacity:.6}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flash .w{font-size:30px;font-weight:800}
/* settings */
.set{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.set>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid #F0ECE4}
.set>div:last-child{border-bottom:0}
.set label{font-weight:600;font-size:14px}
.set select,.set input[type=time],.set input[type=text]{border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:#FAF9F6;max-width:56%}
.sw{width:46px;height:28px;border-radius:99px;background:#D7D2C8;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.dev{display:flex;align-items:center;gap:12px;padding:16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.status{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.status span{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 9px}
.st-on{background:var(--ok-soft);color:var(--ok)}.st-off{background:#EEE9DF;color:var(--muted)}
/* summary */
.sumhead{text-align:center;padding:10px 0 4px}
.sumhead .em{font-size:48px}
.kv{display:flex;justify-content:center;gap:10px;margin:12px 0}
ul.clean{list-style:none;display:flex;flex-direction:column;gap:8px}
ul.clean li{display:flex;gap:10px;align-items:flex-start}
ul.clean li::before{content:"✦";color:var(--accent);font-weight:800}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:440px}
#toast div{background:#17202F;color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px #0003;animation:up .2s;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:sp 1s linear infinite;margin:30px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:26px}
</style>
</head>

/* ---------- estado ---------- */
function defState() {
  return {
    ver: 1, onboarded: false, updatedAt: 0,
    profile: {name: "", goal: "conversation", level: "B1", challenges: [], interests: [], dailyMin: 10, remind: "19:00", autoplay: true, voice: "buttery", rate: 1},
    xp: 0, days: {}, sessions: [], vocab: [], errStats: {}, badges: [], pronBest: 0, pronCount: 0,
    placement: null, goalToast: ""
  };
}
let S = defState();
function hydrate(obj) {
  const d = defState();
  const s = Object.assign(d, obj || {});
  s.profile = Object.assign(defState().profile, (obj && obj.profile) || {});
  ["days", "errStats"].forEach(k => { if (!s[k] || typeof s[k] !== "object") s[k] = {}; });
  ["sessions", "vocab", "badges"].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}
function lsKey() { return LS_KEY + ":" + (SESSION ? SESSION.user.id : "anon"); }
function loadLocal() { S = defState(); try { const r = localStorage.getItem(lsKey()); if (r) S = hydrate(JSON.parse(r)); } catch (e) {} }
function trimmed() {
  const c = JSON.parse(JSON.stringify(S));
  c.sessions = c.sessions.slice(0, 60).map((s, i) => { if (i >= 8) delete s.msgs; return s; });
  c.vocab = c.vocab.slice(0, 1000);
  if (JSON.stringify(c).length > 230000) { c.sessions.forEach(s => delete s.msgs); c.sessions = c.sessions.slice(0, 25); }
  if (JSON.stringify(c).length > 230000) { c.vocab = c.vocab.slice(0, 500); }
  return c;
}
let saveTimer = null, dbBusy = false, dbAgain = false;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(lsKey(), JSON.stringify(S)); } catch (e) {}
  if (CAP.ref) { clearTimeout(saveTimer); saveTimer = setTimeout(flushDb, 2500); }
}
async function flushDb() {
  if (!CAP.ref || !SESSION) return;
  if (dbBusy) { dbAgain = true; return; }
  dbBusy = true;
  try {
    const {error} = await sb.from("papo_estado").upsert({user_id: SESSION.user.id, dados: trimmed(), atualizado_em: new Date().toISOString()});
    if (error) throw error;

const DICT = {target: null, base: "", partial: "", listening: false, was: false};
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code: "timeout"}), ms))]); }

/* IA: chama /api/ai (Vercel AI Gateway), só para usuário logado */
async function aiCall(input, o) {
  o = o || {};
  const messages = typeof input === "string" ? [{role: "user", content: input}] : input;
  const {data} = await sb.auth.getSession();
  const session = data && data.session;
  if (!session) throw {code: "no_session"};
  let r;
  try {
    r = await fetch("/api/ai", {method: "POST", headers: {"Content-Type": "application/json", Authorization: "Bearer " + session.access_token},
      body: JSON.stringify({messages, json: !!o.json, task: o.task || (o.modelTier === "default" ? "summary" : "chat")})});
  } catch (e) { throw {code: "offline"}; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw {code: j.code || (r.status === 429 ? "rate_limited" : "error"), message: j.error || ""};
  return {text: j.text || ""};
}

/* Microfone: Web Speech API (Chrome Android/PC, Safari iPhone/Mac, Edge) */
function makeDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const h = {p: null, f: null, s: null};
  let rec = null, stopping = null;
  return {
    onPartial(f) { h.p = f; }, onFinal(f) { h.f = f; }, onState(f) { h.s = f; },
    start() {
      return new Promise((resolve, reject) => {
        try {
          rec = new SR();
          rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
          let started = false;
          rec.onstart = () => { started = true; if (h.s) h.s({state: "listening"}); resolve(); };
          rec.onresult = e => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
              const r = e.results[i];
              if (r.isFinal) { if (h.f) h.f({text: r[0].transcript}); } else interim += r[0].transcript;
            }
            if (h.p) h.p({text: interim});
          };
          rec.onerror = e => { if (!started) reject({code: (e.error === "not-allowed" || e.error === "service-not-allowed") ? "not_granted" : "error"}); else if (e.error === "not-allowed") reject({code: "not_granted"}); };
          rec.onend = () => { rec = null; if (h.s) h.s({state: "idle", reason: "stopped"}); if (stopping) { stopping(); stopping = null; } };
          rec.start();
        } catch (e) { reject({code: "error"}); }
      });
    },
    stop() { return new Promise(r => { if (!rec) return r(); stopping = r; try { rec.stop(); } catch (e) { r(); } }); }
  };
}

function initCaps() {
  const dict = makeDictation();
  CAP.dict = dict;
  if (dict) {
    dict.onPartial(({text}) => { DICT.partial = text || ""; applyDict(); });
    dict.onFinal(({text}) => { DICT.base = (DICT.base + " " + (text || "")).trim(); DICT.partial = ""; applyDict(); });
    dict.onState(({state}) => {
      DICT.listening = state === "listening";
      if (DICT.listening) DICT.was = true;
      updateMicUI();
      if (state === "idle" && DICT.was) { DICT.was = false; onDictEnd(); }
    });
  }
}

/* ---------- voz (síntese do navegador) ---------- */
let sysVoice = null;
function enVoices() { try { return (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang)); } catch (e) { return []; } }
function pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const vs = enVoices();
  if (S.profile.voice) { const v = vs.find(x => x.name === S.profile.voice); if (v) return v; }
  return vs.find(v => /^en[-_]US/i.test(v.lang) && /natural|google|samantha|aria|jenny|ava|enhanced|premium/i.test(v.name)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs[0] || null;
}
try { if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { sysVoice = pickVoice(); if (view === "profile") render(); }; } catch (e) {}
/* iPhone: libera a voz no primeiro toque */
let voiceUnlocked = false;
document.addEventListener("pointerdown", () => { if (voiceUnlocked || !("speechSynthesis" in window)) return; voiceUnlocked = true; try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }, {capture: true});
function canSpeak() { return "speechSynthesis" in window; }
function stopSpeak() { try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {} CAP.speaking = false; }
async function speak(text, opts) {
  text = String(text || "").slice(0, 1900);
  if (!text || !("speechSynthesis" in window)) return;
  const rate = (opts && opts.rate) || S.profile.rate || 1;
  stopSpeak();
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = clamp(rate, 0.5, 1.5);
    const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; }
    u.onstart = () => { CAP.speaking = true; }; u.onend = u.onerror = () => { CAP.speaking = false; };
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- microfone (ditado) ---------- */
function micToggle(target) {
  if (!CAP.dict) { toast("Seu navegador não reconhece voz. Use o Chrome (Android/PC) ou o Safari (iPhone). Por enquanto, digite sua resposta."); return; }
  if (DICT.listening) { try { CAP.dict.stop().catch(() => {}); } catch (e) {} return; }
  stopSpeak();
  DICT.target = target;
  const inp = target === "chat" ? $("#chatInput") : target === "place" ? $("#placeAns") : null;
  DICT.base = inp ? inp.value.trim() : "";
  DICT.partial = "";
  if (target === "pron") { PR.heard = ""; const h = $("#pronHeard"); if (h) h.textContent = "Ouvindo…"; }
  let p;
  try { p = CAP.dict.start(); } catch (e) { toast("Não consegui abrir o microfone."); return; }
  Promise.resolve(p).catch(e => {
    const c = e && e.code;
    if (c === "not_granted") { CAP.dict = null; toast("Permissão de microfone negada. Você pode continuar digitando."); render(); }
    else if (c !== "dismissed") toast("Não consegui abrir o microfone.");
  });
}
function applyDict() {
  const t = (DICT.base + " " + DICT.partial).trim();
  if (DICT.target === "chat") { const el = $("#chatInput"); if (el) { el.value = t; autoGrow(el); } }
  else if (DICT.target === "place") { const el = $("#placeAns"); if (el) el.value = t; }
  else if (DICT.target === "pron") { const el = $("#pronHeard"); if (el) el.textContent = t || "Ouvindo…"; }
}
function updateMicUI() {
  document.querySelectorAll("[data-mic]").forEach(b => {
    b.classList.toggle("live", DICT.listening && b.dataset.mic === DICT.target);
    if (b.dataset.lbl) b.innerHTML = DICT.listening && b.dataset.mic === DICT.target ? "⏹" : "🎤";
  });
  const hint = $("#micHint"); if (hint) hint.textContent = DICT.listening ? "Ouvindo… toque de novo para parar" : "";
}
function onDictEnd() {
  if (DICT.target === "chat" && view === "chat") { const el = $("#chatInput"); if (el && el.value.trim()) sendChat(); }
  else if (DICT.target === "pron" && view === "pron") { evaluatePron((DICT.base + " " + DICT.partial).trim()); }
}

/* ---------- IA ---------- */
function aiErr(e) {
  const c = e && e.code;
  if (c === "rate_limited") return "Muitas mensagens seguidas. Espere alguns segundos e tente de novo.";
  if (c === "no_ai" || c === "no_session") return "Entre na sua conta para conversar com a IA.";
  if (c === "daily_limit") return "Você atingiu o limite diário de mensagens da IA. Volte amanhã!";
  if (c === "offline") return "Sem conexão com a internet. Tente de novo.";
  return "Não consegui responder agora. Toque para tentar de novo.";
}
function parseJSON(t) {
  t = String(t || "").replace(/```json/gi, "").replace(/```/g, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw {code: "bad_json"};
  return JSON.parse(t.slice(a, b + 1));
}
async function askJSON(prompt, tier) {
  if (!CAP.sample) throw {code: "no_ai"};
  const opts = {modelTier: tier || "quick", cache: false};
  if (typeof CAP.sample.json === "function") {
    try { const v = await CAP.sample.json(prompt, opts); if (v && typeof v === "object") return v; }
    catch (e) { const c = e && e.code; if (c === "not_granted" || c === "rate_limited") throw e; }
  }
  const r = await CAP.sample(prompt + "\n\nRespond with valid JSON only, no code fences, no extra text.", Object.assign({json: true}, opts));
  return parseJSON(r && r.text);
}
async function askText(prompt, tier) {
  if (!CAP.sample) throw {code: "no_ai"};
  const r = await CAP.sample(prompt, {modelTier: tier || "quick", cache: false});
  return String((r && r.text) || "").trim();
}
function learnerCtx() {
  const p = S.profile;
  const goal = (GOALS.find(g => g[0] === p.goal) || GOALS[3])[2];
  return `Learner: ${p.name || "the learner"}, Brazilian, CEFR level ${p.level}. Goal: ${goal}. Interests: ${(p.interests || []).join(", ") || "general topics"}.`;
}

/* ---------- gamificação / tempo ---------- */
function todaySec() { return S.days[today()] || 0; }
function level() { return Math.floor(S.xp / 200) + 1; }
function streak() {
  let k = today(), n = 0;
  if ((S.days[k] || 0) < 60) k = addDays(k, -1);
  while ((S.days[k] || 0) >= 60) { n++; k = addDays(k, -1); }
  return n;
}
function addXP(n) {
  const before = level();
  S.xp += n;

  ${PR.src !== "custom" ? `<div class="seg mt12"><button class="${PR.src === "level" ? "on" : ""}" onclick="A.pronSrc('level')">Nível ${esc(S.profile.level)}</button><button class="${PR.src === "hard" ? "on" : ""}" onclick="A.pronSrc('hard')">Sons difíceis</button><button class="${PR.src === "vocab" ? "on" : ""}" onclick="A.pronSrc('vocab')">Meu vocabulário</button></div>` : `<div style="height:12px"></div>`}
  <div class="card">
    <div class="target">${r ? `<div class="wscore">${r.words.map(w => `<span class="${cls(w.sc)}">${esc(w.w)}<small>${w.sc}</small></span>`).join("")}</div>` : esc(target)}</div>
    <div class="row-flex" style="justify-content:center"><button class="btn sec sm" onclick="A.sayText(PR.list[PR.idx])">🔊 Ouvir</button><button class="btn sec sm" onclick="A.sayText(PR.list[PR.idx],0.72)">🐢 Devagar</button></div>
  </div>
  ${CAP.dict ? `<div class="center mt16"><button class="bigmic mic" data-mic="pron" data-lbl="1" onclick="A.mic('pron')">🎤</button><p class="small muted" id="micHint">Toque, leia a frase em voz alta e toque de novo</p>
    <p class="small mt8" id="pronHeard" style="min-height:20px;color:var(--brand-2)">${esc(PR.heard || "")}</p></div>`
    : `<div class="banner info mt16">Seu navegador não reconhece voz. Abra no Chrome (Android/PC) ou no Safari (iPhone) para gravar. Por enquanto, ouça e repita em voz alta (shadowing) e use as dicas do coach.</div>`}
  ${r ? `<div class="card mt12 center"><div class="score-big" style="color:${r.overall >= 85 ? "var(--ok)" : r.overall >= 55 ? "var(--warn)" : "var(--bad)"}">${r.overall}</div><p class="small muted">${r.overall >= 85 ? "Excelente! Bem claro." : r.overall >= 55 ? "Bom! Ajuste as palavras em amarelo e vermelho." : "Vamos de novo, mais devagar."}</p>
    <p class="small muted mt8">Nota baseada no reconhecimento de voz: palavras entendidas corretamente valem 100.</p></div>` : ""}
  <div class="mt12">${PR.tips ? (PR.tips === "…" ? `<div class="card center"><span class="dots"><i></i><i></i><i></i></span></div>` : `<div class="card"><h3 class="mb8">🧑‍🏫 Dicas do coach</h3>${PR.tips.map(t => `<div class="mb12"><b>${esc(t.word)}</b> <span class="ipa">${esc(t.ipa || "")}</span><p class="small muted">${esc(t.tip || "")}</p></div>`).join("")}</div>`)
    : `<button class="btn ghost block" onclick="A.pronTips()">🧑‍🏫 Dicas de pronúncia desta frase</button>`}</div>
  <div class="row-flex mt12"><button class="btn ghost block" onclick="A.pronRetry()">↻ Repetir</button><button class="btn block" onclick="A.pronNext()">Próxima frase →</button></div>`;
};
async function pronTips() {
  if (!CAP.sample) { toast(aiErr({code: "no_ai"})); return; }
  const target = PR.list[PR.idx];
  const weak = PR.result ? PR.result.words.filter(w => w.sc < 85).map(w => w.w) : [];
  PR.tips = "…"; render();
  try {
    const j = await askJSON(`You are a pronunciation coach for Brazilian Portuguese speakers learning American English.
Sentence: "${target}"
${weak.length ? `Words the learner struggled with: ${weak.join(", ")}.` : "Pick the 2-3 words in this sentence that Brazilians most often mispronounce."}
Return JSON {"tips":[{"word":"...","ipa":"/IPA (American)/","tip":"practical tip in Brazilian Portuguese (mouth/tongue position, comparison with a Portuguese sound, common mistake to avoid), max 2 sentences"}]} with 2 to 4 items. Add a final item with word "Entonação" and a tip about rhythm/stress of the whole sentence.`, "quick");
    PR.tips = Array.isArray(j.tips) ? j.tips : [];
  } catch (e) { PR.tips = null; toast(aiErr(e)); }
  if (view === "pron") render();
}

let VQ = "";
VIEWS.vocab = () => {
  const due = dueVocab().length;
  const q = VQ.toLowerCase();
  const list = S.vocab.filter(v => !q || v.en.toLowerCase().includes(q) || (v.pt || "").toLowerCase().includes(q));
  const learned = S.vocab.filter(v => v.learned).length;
  return `<h1>Vocabulário</h1><p class="muted mt8">Palavras das suas conversas e as que você adicionar. ${S.vocab.length} no total · ${learned} dominadas.</p>
  <div class="row-flex mt12"><button class="btn block ${due ? "orange" : "sec"}" onclick="A.reviewOpen()">🧠 Revisar ${due ? "(" + due + ")" : ""}</button><button class="btn sec" onclick="A.addWord()">＋ Adicionar</button></div>
  <input class="field mt12" placeholder="Buscar…" value="${esc(VQ)}" oninput="VQ=this.value;A.vocabList()">
  <div id="vlist" class="list mt12">${vocabRows(list)}</div>`;
};
function vocabRows(list) {
  if (!S.vocab.length) return `<div class="card center muted small">Ainda vazio. Converse com a Lu: as palavras novas e as que você errar entram aqui automaticamente.</div>`;
  if (!list.length) return `<p class="muted small center">Nada encontrado.</p>`;
  return list.slice(0, 300).map(v => `<div class="vrow ${v.learned ? "done" : ""}"><div class="body"><b>${esc(v.en)}</b><div>${esc(v.pt)}</div>${v.ex ? `<i>${esc(v.ex)}</i>` : ""}</div>
    <button class="iconbtn" onclick="A.sayV('${v.id}')">🔊</button><button class="iconbtn" title="Dominada" onclick="A.learn('${v.id}')">${v.learned ? "↺" : "✓"}</button><button class="iconbtn" onclick="A.delV('${v.id}')">🗑️</button></div>`).join("");
}
let RV = {queue: [], i: 0, show: false, done: 0};
VIEWS.review = () => {
  const v = RV.queue[RV.i];
  if (!v) return `<div class="row-flex"><button class="iconbtn" onclick="A.go('vocab')">←</button></div><div class="center" style="padding-top:60px"><div style="font-size:60px">🎉</div><h1 class="mt8">Revisão concluída!</h1><p class="muted mt8">${RV.done} palavras revisadas. Volte amanhã para as próximas.</p><button class="btn mt16" onclick="A.go('home')">Voltar ao início</button></div>`;
  return `<div class="row-flex between"><button class="iconbtn" onclick="A.go('vocab')">←</button><b>🧠 Revisão</b><span class="pill">${RV.i + 1}/${RV.queue.length}</span></div>
  <div class="card flash mt16"><div class="w">${esc(v.en)}</div><button class="btn sec sm" onclick="A.sayV('${v.id}')">🔊 Ouvir</button>
    ${RV.show ? `<div class="mt12" style="font-size:18px;font-weight:700;color:var(--brand-2)">${esc(v.pt || "—")}</div>${v.ex ? `<p class="muted small">${esc(v.ex)}</p>` : ""}` : `<p class="muted small mt12">Você lembra o significado? Tente falar uma frase com ela.</p>`}</div>
  ${RV.show ? `<div class="row-flex mt16"><button class="btn ghost block" style="color:var(--bad)" onclick="A.grade(0)">Errei</button><button class="btn ghost block" onclick="A.grade(1)">Difícil</button><button class="btn block" style="background:var(--ok)" onclick="A.grade(2)">Acertei</button></div>`
    : `<button class="btn block mt16" onclick="A.reveal()">Mostrar resposta</button>`}`;
};

/* ============================================================

   ============================================================ */
VIEWS.progress = () => {
  const totalMin = mins(Object.values(S.days).reduce((a, b) => a + b, 0));
  const lv = level(), inLv = S.xp % 200;
  const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(today(), -i));
  const max = Math.max(S.profile.dailyMin * 60, ...days.map(d => S.days[d] || 0));
  const wd = ["D", "S", "T", "Q", "Q", "S", "S"];
  const es = S.errStats, et = (es.grammar || 0) + (es.vocabulary || 0) + (es.naturalness || 0);
  return `<h1>Progresso</h1>
  <div class="card mt12"><div class="row-flex between"><h3>⭐ Nível ${lv}</h3><span class="small muted">${inLv}/200 XP</span></div><div class="xpbar"><i style="width:${inLv / 2}%"></i></div><p class="small muted mt8">${S.xp} XP no total</p></div>
  <div class="stats mt12"><div class="stat"><b>🔥 ${streak()}</b><span>dias seguidos</span></div><div class="stat"><b>${totalMin}</b><span>minutos falando</span></div><div class="stat"><b>${S.sessions.length}</b><span>conversas</span></div></div>
  <h2>Últimos 7 dias</h2>
  <div class="card"><div class="bars">${days.map(d => { const s = S.days[d] || 0; const [y, m, dd] = d.split("-").map(Number); const w = new Date(y, m - 1, dd).getDay(); return `<div class="b"><small>${mins(s) || ""}</small><i class="${s >= S.profile.dailyMin * 60 ? "hit" : ""}" style="height:${Math.max(3, s / max * 100)}%"></i><em>${wd[w]}</em></div>`; }).join("")}</div>
  <p class="small muted mt8">Laranja = meta de ${S.profile.dailyMin} min batida.</p></div>
  <h2>Conquistas</h2>
  <div class="badges">${BADGES.map(b => `<div class="badge ${S.badges.includes(b.id) ? "" : "off"}"><span class="em">${b.em}</span>${esc(b.name)}</div>`).join("")}</div>
  ${et ? `<h2>Onde você mais erra</h2><div class="card">${[["Gramática", es.grammar || 0], ["Vocabulário", es.vocabulary || 0], ["Naturalidade", es.naturalness || 0]].map(x => `<div class="meter"><span>${x[0]}</span><div class="t"><i style="width:${Math.round(x[1] / et * 100)}%;background:var(--accent)"></i></div><b>${x[1]}</b></div>`).join("")}</div>` : ""}
  <div class="stats mt12"><div class="stat"><b>${S.vocab.length}</b><span>palavras</span></div><div class="stat"><b>${S.pronBest || 0}</b><span>melhor pronúncia</span></div><div class="stat"><b>${S.profile.level}</b><span>nível CEFR</span></div></div>
  <h2>Histórico</h2>
  <div class="list">${S.sessions.length ? S.sessions.slice(0, 40).map((s, i) => `<button class="item" onclick="A.openSession(${i})"><span class="em">${s.emoji}</span><div class="body"><b>${esc(s.title)}</b><span>${new Date(s.date).toLocaleDateString("pt-BR")} · ${Math.max(1, mins(s.dur))} min · ${s.turns} falas${s.summary && s.summary.estimate ? " · " + esc(String(s.summary.estimate).split(/[,.;(]/)[0]) : ""}</span></div><span class="chev">›</span></button>`).join("") : `<div class="card center muted small">Suas conversas aparecem aqui com resumo e correções.</div>`}</div>`;
};

/* ============================================================
   AÇÕES
   ============================================================ */
const A = {
  go: v => go(v),
  close: closeSheet,
  start: id => startChat(id),
  mic: t => micToggle(t),
  /* onboarding */
  obNext() {
    if (OB.step === 1 && !OB.d.name.trim()) { toast("Digite seu nome 🙂"); return; }
    if (OB.step === 3 && OB.d.level) { /* nada */ }
    OB.step = Math.min(OB.step + 1, OB_TOTAL); render(); window.scrollTo(0, 0);
  },
  obBack() {
    if (OB.step === 7 && OB.place.i > 0 && !OB.place.result) { OB.place.i--; render(); return; }
    OB.step = Math.max(0, OB.step - 1); render();
  },
  obSet(k, v) { OB.d[k] = v; render(); },
  obToggle(k, v) { const a = OB.d[k]; const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); render(); },
  obPlaceNext() {
    const P = OB.place; const el = $("#placeAns"); const v = (el && el.value || "").trim();
    if (DICT.listening) { try { CAP.dict.stop().catch(() => {}); } catch (e) {} }
    if (v.split(/\s+/).length < 2) { toast("Responda com pelo menos uma frase, em inglês."); return; }
    P.ans[P.i] = v;
    if (P.i < 2) { P.i++; render(); return; }
    A.evalPlacement();
  },
  async evalPlacement() {
    const P = OB.place; P.busy = true; render();
    try {
      const j = await askJSON(`You are a certified CEFR examiner. A Brazilian learner answered 3 speaking prompts (transcribed from speech or typed, ignore punctuation and capitalization). Self-assessed level: ${OB.d.level || S.profile.level}.
${PLACE_Q.map((q, i) => `Q${i + 1}: ${q}\nA${i + 1}: ${P.ans[i] || "(no answer)"}`).join("\n")}
Estimate the CEFR level (one of A1, A2, B1, B2, C1). Return JSON {"level":"B1","reason_pt":"2 sentences in Brazilian Portuguese explaining why","strengths":["1-2 short items in Portuguese"],"focus":["2 short items in Portuguese to improve"]}`, "default");
      if (!["A1", "A2", "B1", "B2", "C1"].includes(j.level)) j.level = OB.d.level || "B1";
      P.result = j; OB.d.level = j.level;
    } catch (e) { toast(aiErr(e)); }
    P.busy = false;
    if (view === "onb") render(); else if (view === "placement") render();
  },
  obSkipPlace() { OB.step++; render(); },
  obFinish() {
    const d = OB.d;
    Object.assign(S.profile, {name: d.name.trim(), goal: d.goal || "conversation", level: d.level || "B1", challenges: d.challenges, interests: d.interests, dailyMin: d.dailyMin, remind: d.remind});
    if (OB.place.result) S.placement = {level: OB.place.result.level, date: today(), reason: OB.place.result.reason_pt || ""};
    S.onboarded = true; addXP(10); save(); flushDb();
    go("home");
  },
  /* chat */
  send: () => sendChat(),
  retry() { if (!CH || CH.busy) return; CH.msgs = CH.msgs.filter(m => !m.err); aiTurn(); },
  leaveChat() {
    if (CH && CH.msgs.some(m => m.role === "user")) confirmBox("Sair agora? Você perde o resumo desta conversa.", "Sair", () => { stopSpeak(); CH = null; go("home"); });
    else { stopSpeak(); CH = null; go("home"); }
  },
  endChat: () => endChat(),
  toggleAuto() { S.profile.autoplay = !S.profile.autoplay; save(); if (!S.profile.autoplay) stopSpeak(); const keep = $("#chatInput") && $("#chatInput").value; render(); if (keep) $("#chatInput").value = keep; toast(S.profile.autoplay ? "Áudio automático ligado" : "Áudio automático desligado"); },
  togglePT() { if (!CH) return; if (DICT.listening) { try { CAP.dict.stop().catch(() => {}); } catch (e) {} } CH.pt = !CH.pt; render(); const el = $("#chatInput"); if (el) el.focus(); },
  useEN() { if (!CH) return; CH.pt = false; const en = window.__en || ""; render(); const el = $("#chatInput"); if (el) { el.value = en; autoGrow(el); } setAssist(""); toast(CAP.dict ? "Agora fale a frase no microfone 🎤" : "Leia em voz alta e envie ➤"); },
  useSugg(i) { const s = (window.__sugg || [])[i]; if (!s) return; const el = $("#chatInput"); if (el) { el.value = s.en; autoGrow(el); } speak(s.en); setAssist(""); },
  assistClose() { setAssist(""); },
  hint: () => hint(),
  say(id, rate) { const m = CH && CH.msgs.find(x => x.id === id); if (m) speak(m.text, rate ? {rate} : null); },
  sayText(t, rate) { speak(t, rate ? {rate} : null); },
  async tr(id) {
    const m = CH && CH.msgs.find(x => x.id === id); if (!m) return;
    if (m.pt && m.pt !== "…") { m.pt = ""; updateMsg(m); return; }
    m.pt = "…"; updateMsg(m);
    try { m.pt = await askText(`Translate to natural Brazilian Portuguese. Return only the translation.\n\n${m.text}`, "quick"); }
    catch (e) { m.pt = ""; toast(aiErr(e)); }
    if (CH) updateMsg(m);
  },
  fix(id) { const m = CH && CH.msgs.find(x => x.id === id); if (m && m.corr) fixSheet(m); },
  recheck(id) { const m = CH && CH.msgs.find(x => x.id === id); if (m) correctMsg(m); },
  pronFrom(id) {
    const m = CH && CH.msgs.find(x => x.id === id); if (!m) return;
    const parts = m.text.split(/(?<=[.!?])\s+/).filter(s => s.split(/\s+/).length >= 3);
    A.pronText(parts.length ? parts[0] : m.text, "chat");
  },
  pronText(t, back) { closeSheet(); PR = {src: "custom", list: [String(t)], idx: 0, result: null, heard: "", tips: null, back: back || (view === "chat" || CH ? "chat" : "practice")}; go("pron"); },
  /* pronúncia */
  pronOpen() { PR = {src: "level", list: pronList("level"), idx: 0, result: null, heard: "", tips: null, back: view}; go("pron"); },
  pronSrc(s) { PR.src = s; PR.list = pronList(s); PR.idx = 0; PR.result = null; PR.heard = ""; PR.tips = null; render(); },
  pronNext() {
    if (PR.src === "custom") { A.pronBack(); return; }
    PR.idx = (PR.idx + 1) % PR.list.length; PR.result = null; PR.heard = ""; PR.tips = null; render();
  },
  pronRetry() { PR.result = null; PR.heard = ""; render(); },
  pronTips: () => pronTips(),
  pronBack() { if (DICT.listening) { try { CAP.dict.stop().catch(() => {}); } catch (e) {} } go(PR.back === "chat" && CH ? "chat" : (PR.back && VIEWS[PR.back] && PR.back !== "pron" ? PR.back : "practice")); },
  /* vocab */
  vocabList() { const el = $("#vlist"); if (!el) return; const q = VQ.toLowerCase(); el.innerHTML = vocabRows(S.vocab.filter(v => !q || v.en.toLowerCase().includes(q) || (v.pt || "").toLowerCase().includes(q))); },
  sayV(id) { const v = S.vocab.find(x => x.id === id); if (v) speak(v.en); },
  sayWord(i) { const w = (window.__sumWords || [])[i]; if (w) speak(w.en); },
  learn(id) { const v = S.vocab.find(x => x.id === id); if (!v) return; v.learned = !v.learned; if (!v.learned) { v.box = 0; v.due = today(); } save(); A.vocabList(); },
  delV(id) { confirmBox("Remover esta palavra?", "Remover", () => { S.vocab = S.vocab.filter(x => x.id !== id); save(); render(); }); },
  addWord() {
    sheet(`<h3 class="mb12">Adicionar palavra ou expressão</h3><input id="nwEn" class="field mb8" placeholder="Em inglês (ex.: look forward to)"><input id="nwPt" class="field mb8" placeholder="Tradução (opcional: a IA completa)">
      <div class="row-flex mt8"><button class="btn ghost block" onclick="A.close()">Cancelar</button><button class="btn block" onclick="A.saveWord()">Salvar</button></div>`);
    setTimeout(() => { const e = $("#nwEn"); if (e) e.focus(); }, 50);
  },
  async saveWord() {
    const en = ($("#nwEn").value || "").trim(); let pt = ($("#nwPt").value || "").trim(); let ex = "";
    if (!en) { toast("Digite a palavra em inglês."); return; }
    closeSheet();
    if (CAP.sample) {
      try { const j = await askJSON(`For the English word or expression "${en}", return JSON {"pt":"Brazilian Portuguese translation","example":"short natural English example sentence"}.`, "quick"); if (!pt) pt = j.pt || ""; ex = j.example || ""; } catch (e) {}
    }
    if (addVocab(en, pt, ex, "manual")) { addXP(1); checkBadges(); save(); toast("Adicionada ✓"); } else toast("Essa já está na lista.");
    if (view === "vocab") render();
  },
  reviewOpen() {
    const q = dueVocab();
    if (!q.length) { toast(S.vocab.length ? "Nenhuma palavra para revisar hoje 🎉" : "Seu vocabulário ainda está vazio."); if (view !== "vocab") go("vocab"); return; }
    RV = {queue: q.slice(0, 20).sort(() => Math.random() - .5), i: 0, show: false, done: 0}; go("review");
  },
  reveal() { RV.show = true; render(); },
  grade(g) {
    const v = RV.queue[RV.i]; if (!v) return;
    if (g === 0) v.box = 0; else if (g === 2) v.box = (v.box || 0) + 1;
    if (v.box >= BOXES.length) { v.learned = true; v.box = BOXES.length - 1; toast("🧠 " + v.en + " dominada!"); }
    v.due = addDays(today(), g === 0 ? 1 : BOXES[v.box || 0]);
    RV.done++; addXP(2); RV.i++; RV.show = false; checkBadges(); save(); render();
  },
  /* progresso */
  openSession(i) { const r = S.sessions[i]; if (!r) return; SUM = {loading: false, rec: r, added: [], xp: 0, fromProgress: true}; go("summary"); },
  /* perfil */
  setP(k, v) {
    if (k === "dailyMin") v = Number(v); if (k === "rate") v = Number(v);
    if (k === "autoplay") v = !!v;
    S.profile[k] = v; save(); if (k === "voice") sysVoice = pickVoice();
    if (["autoplay", "level"].includes(k)) render();
    if (k === "level") toast("Nível atualizado para " + v);
  },
  editInterests() {
    window.__int = (S.profile.interests || []).slice();
    const draw = () => sheet(`<h3 class="mb12">Temas de interesse</h3><div class="chips">${INTERESTS.map((i, n) => `<button class="opt ${window.__int.includes(i) ? "on" : ""}" onclick="A.togInt(${n})">${esc(i)}</button>`).join("")}</div><button class="btn block mt16" onclick="A.saveInt()">Salvar</button>`);
    window.__drawInt = draw; draw();
  },
  togInt(n) { const v = INTERESTS[n]; const a = window.__int; const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); window.__drawInt(); },
  saveInt() { S.profile.interests = window.__int.slice(); save(); closeSheet(); render(); },
  redoPlacement() {
    if (!CAP.sample) { toast(aiErr({code: "no_ai"})); return; }
    OB = {step: 7, d: Object.assign({}, S.profile, {challenges: (S.profile.challenges || []).slice(), interests: (S.profile.interests || []).slice()}), place: {i: 0, ans: [], busy: false, result: null}};
    view = "placement"; render();
  },
  placeDone() {
    if (OB.place.result) { S.profile.level = OB.place.result.level; S.placement = {level: OB.place.result.level, date: today(), reason: OB.place.result.reason_pt || ""}; save(); toast("Nível atualizado: " + OB.place.result.level); }
    go("profile");
  },
  invite() {
    const text = `Estou treinando conversação em inglês com uma IA no Papo English 🇺🇸🗣️ Ela corrige na hora, em português, e dá nota de pronúncia palavra por palavra. Bora praticar junto? Me chama que eu te passo o link.`;
    window.__inv = text;
    sheet(`<h3>🎁 Convide um amigo</h3><p class="small muted mt8 mb12">Copie a mensagem e mande no WhatsApp junto com o link do app.</p><div class="card small">${esc(text)}</div><button class="btn block mt12" onclick="A.copyInv()">Copiar mensagem</button>`);
  },
  copyInv() { try { navigator.clipboard.writeText(window.__inv).then(() => toast("Copiado ✓"), () => toast("Não consegui copiar. Selecione o texto e copie manualmente.")); } catch (e) { toast("Não consegui copiar."); } },
  async logout() { confirmBox("Sair da sua conta neste aparelho?", "Sair", async () => { stopSpeak(); await flushDb(); CH = null; await sb.auth.signOut(); }); },
  async login() { const e = ($("#le").value || "").trim(), p = $("#lp").value; if (!e || !p) return lmsg("Preencha e-mail e senha.", 1); lmsg("Entrando…"); const {error} = await sb.auth.signInWithPassword({email: e, password: p}); if (error) lmsg(error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message, 1); },
  async signup() { const e = ($("#le").value || "").trim(), p = $("#lp").value; if (!e || !p) return lmsg("Preencha e-mail e uma senha.", 1); if (p.length < 6) return lmsg("A senha precisa ter pelo menos 6 caracteres.", 1); lmsg("Criando conta…"); const {data, error} = await sb.auth.signUp({email: e, password: p, options: {emailRedirectTo: baseURL()}}); if (error) return lmsg(error.message, 1); if (!data.session) lmsg("Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre."); },
  async forgot() { const e = ($("#le").value || "").trim(); if (!e) return lmsg("Digite seu e-mail acima.", 1); const {error} = await sb.auth.resetPasswordForEmail(e, {redirectTo: baseURL()}); lmsg(error ? error.message : "Enviamos um link para redefinir a senha.", !!error); },
  async google() { lmsg("Abrindo o Google…"); const {error} = await sb.auth.signInWithOAuth({provider: "google", options: {redirectTo: baseURL(), queryParams: {prompt: "select_account"}}}); if (error) lmsg(error.message.includes("provider is not enabled") ? "Login com Google não está ativado." : error.message, 1); },
  async newPass() { const p = $("#np").value; if (!p || p.length < 6) return lmsg("A senha precisa ter pelo menos 6 caracteres.", 1); const {error} = await sb.auth.updateUser({password: p}); if (error) return lmsg(error.message, 1); RECOVERY = false; toast("Senha alterada ✓"); setSession(SESSION); },
  reset() { confirmBox("Apagar todo o progresso, vocabulário e histórico?", "Apagar tudo", () => { const keepName = S.profile.name; S = defState(); S.profile.name = keepName; OB = {step: 0, d: {name: keepName, goal: "", level: "", challenges: [], interests: [], dailyMin: 10, remind: "19:00"}, place: {i: 0, ans: [], busy: false, result: null}}; save(); flushDb(); go("onb"); }); }
};
window.A = A;

/* nivelamento refeito pelo perfil reaproveita a tela do onboarding */
VIEWS.placement = () => {
  const html = obPlacement();
  return html.replace(`onclick="A.obNext()">Usar`, `onclick="A.placeDone()">Usar`).replace(`onclick="A.obSkipPlace()"`, `onclick="A.go('profile')"`).replace(`onclick="A.obBack()"`, `onclick="A.go('profile')"`);
};

/* ---------- início ---------- */
initCaps();
render();
if (!sb) { LOADING = false; SESSION = null; document.getElementById("screen").innerHTML = `<div class="banner warn" style="margin-top:40px">Não foi possível carregar o sistema de login. Verifique sua conexão e recarregue a página.</div>`; }
else {
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "PASSWORD_RECOVERY") { RECOVERY = true; SESSION = session; LOADING = false; render(); return; }
    if (ev === "TOKEN_REFRESHED" || ev === "USER_UPDATED") { SESSION = session; return; }
    setTimeout(() => setSession(session), 0);
  });
  sb.auth.getSession().then(({data}) => setSession(data && data.session)).catch(() => setSession(null));
}
</script>
</body>
</html>
